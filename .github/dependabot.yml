version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      go-deps:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      gh-actions:
        patterns: ["*"]
  # Dockerfile and Dockerfile.release pin base images by digest. Keep the
  # digests current, but leave moving to a new Go minor (golang:1.26 to 1.27)
  # to a deliberate bump alongside go.mod and the workflows.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: golang
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      docker-images:
        patterns: ["*"]
  # Docs site deps are a pip-compile lockfile (docs/requirements.txt compiled
  # from docs/requirements.in). Keeping the direct dep moving on a schedule
  # stops its transitive version ceilings from going stale -- a stale ceiling
  # is what broke the Docs workflow when a security bump pushed
  # pymdown-extensions past the `~=10.2` pin of a long-frozen mkdocs-material.
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    groups:
      docs-deps:
        patterns: ["*"]

name: Maintenance audit

# Keeps one issue labeled "maintenance" up to date with Kubernetes and Go support,
# Makefile tool pins, and govulncheck results for the latest release binary.

on:
  schedule:
    - cron: '17 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write  # open or update the tracking issue
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.x
          cache: false
      - name: Run the audit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash hack/maintenance-audit.sh --publish

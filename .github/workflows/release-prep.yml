name: Release prep

# Manual trigger only. Previews a release prep (next version, CHANGELOG scaffold,
# chart bump, doc version strings, categorized PR list) in the job summary and
# changes nothing. The real run is hack/release-prep.sh --no-dry-run, run locally;
# see CONTRIBUTING.md. Tagging stays manual after that PR merges — existing
# release.yml + helm-release.yml publish from the pushed tag.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Which semver component to bump'
        required: true
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: read

jobs:
  prep:
    name: Preview release prep
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # list PRs merged since the last tag

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0    # need full history + tags for version computation

      - name: Run release-prep script
        shell: bash  # adds pipefail, so a failed preview fails the job despite tee
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
        run: |
          chmod +x hack/release-prep.sh
          hack/release-prep.sh --bump "$BUMP" --dry-run \
            | tee -a "$GITHUB_STEP_SUMMARY"
